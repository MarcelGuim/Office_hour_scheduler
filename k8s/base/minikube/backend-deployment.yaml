apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-hour-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: office-hour-scheduler
  template:
    metadata:
      labels:
        app: office-hour-scheduler
    spec:
      containers:
        - name: office-hour-scheduler
          ports:
            - containerPort: 3000
              name: http  
          image: office-hour-scheduler:1.0
          imagePullPolicy: Never
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PORT
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PUBLIC_BASE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
